name: Gece Haber Yenile

# Her gece Türkiye saatiyle 00:00'da (UTC+3 → 21:00 UTC) haberleri tazeleyip
# statik siteyi GitHub Pages'e yayar. main itişinde ve Actions sekmesinden elle de
# çalıştırılabilir. (Zamanlanmış tetikler yalnızca varsayılan daldan çalışır.
# Eski arena/* dal tetikleyicileri, o dallar silindiği için kaldırıldı.)
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Birim testleri
        run: npm test

      - name: Statik siteyi üret (haber + kapak görselleri + tam metin + piyasa + hava)
        env:
          TELGRAF_CHROME: /usr/bin/google-chrome
          TELGRAF_HEADFUL: "1"
          # Cloudflare/DataDome çözmesi tek başına ~12 sn sürebiliyor: URL bütçesi
          # 30 sn, toplam süre aşama bütçeleriyle sınırlı.
          TELGRAF_STEALTH_TIMEOUT: "45000"
          TELGRAF_STEALTH_CHALLENGE_WAIT: "16000"
          # Kurtarma turu (Wayback kopyası / tel aynası / beklemeli jina):
          # duvarlı yayıncılarda kapsamı artıran üçüncü geçiş. Süreleri sınırlı,
          # böylece derleme 30 dakikalık iş zamanına çarpmaz.
          # Görsel aşaması çoğunlukla HTTP'dir; tarayıcı penceresini habere
          # bırakmak kapsamı artırıyor (CI ölçümü: article 371/360sn dolunca
          # 197 iş kuyrukta düştü ve AP 15/36'da kaldı).
          TELGRAF_STEALTH_WALL_MS: "900000"
          TELGRAF_STEALTH_ARTICLE_BUDGET: "540000"
          TELGRAF_STEALTH_IMAGE_BUDGET: "180000"
          TELGRAF_RESCUE: "1"
          TELGRAF_RESCUE_MS: "240000"
          TELGRAF_RESCUE_ITEM_MS: "20000"
        run: xvfb-run -a node scripts/build-static.mjs

      - name: Pages arşivi yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Yayına yalnızca main yetkili (github-pages ortam koruma kuralı);
    # dal itişleri derlemeyi doğrular, yayın main'den yapılır.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayımla
        id: deployment
        uses: actions/deploy-pages@v4
